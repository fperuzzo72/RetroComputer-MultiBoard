; Retro machines on small boards: several emulated machines, several boards,
; one tree.
;
;   src/boards/cyd/        the Freenove FNK0103 CYD: ST7796 panel, amplifier,
;                          BLE keyboard host, card, serial console
;   src/boards/eink/       the M5Stack Paper Mono and PaperS3: e-ink, touch
;   src/msx/ src/spectrum/ src/mac/
;                          machines, which know nothing about any board
;   src/machine.h          the only thing that crosses
;
; A board knows nothing about what is being emulated, and a machine knows
; nothing about the board. Each env below is one board with one or more
; machines built in:
;
;   pio run -e msx             CYD, the MSX1, an Epcom Hotbit HB-8000
;   pio run -e spectrum        CYD, the ZX Spectrum 48K
;   pio run -e cyd             CYD, both, chosen at boot
;   pio run -e papermono       Paper Mono: MSX, Spectrum and Macintosh,
;                              chosen at boot
;   pio run -e papers3         PaperS3: the same three
;
; Each produces its own firmware; flash whichever you want on the device.

; =====================================================================
; The CYD: Freenove FNK0103 ("ESP32-32E" 3.5" ST7796 board).
;
; Board: plain ESP32-WROOM-32E (Xtensa LX6, no PSRAM on most units - see
; README "Hardware notes"). board=esp32dev is the standard generic profile
; for this chip/module family and works fine here.
[cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/local_bios.py
; 921600 fails on this board: esptool gets the MAC and then times out
; uploading the stub flasher. 460800 is reliable over its CH340.
upload_speed = 460800

; See partitions.csv: no OTA slot, and the unused SPIFFS and coredump
; partitions handed to the application, which is where the ROMs live.
board_build.partitions = partitions.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    ; NimBLE 1.x is built for Arduino-ESP32 2.x / IDF 4. On the 3.x core
    ; here it compiles but dies at boot: its unconditional
    ; esp_bt_controller_mem_release(CLASSIC_BT) leaves the BLE-only
    ; controller in a released state, and esp_bt_controller_init() then
    ; returns ESP_ERR_INVALID_STATE and aborts. 2.x is the version that
    ; matches this core.
    h2zero/NimBLE-Arduino @ ^2.2.0

build_flags =
    ; --- TFT_eSPI setup for the FNK0103/FNK0114N 3.5" ST7796 panel ---
    ; Pin numbers and SPI settings copied from Freenove's own
    ; TFT_eSPI_Setups/FNK0114N_3.5_320x480_ST7796.h (same physical board,
    ; see README "Hardware reference").
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; --- fMSX core build flags (matches the flags used by the reference
    ; ESP32 port this core was pulled from) ---
    -D BPS16
    -D LSB_FIRST
    -D ESP32

    ; The board layer and whichever machine is built in.
    -I src
    -I src/boards/cyd
    -I src/boards/common

    ; --- memory budget (no PSRAM: every kilobyte is contested) ---
    ; One BLE connection is all this needs, and none of the peripheral
    ; side: the board is a keyboard host, never a keyboard.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=6
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64
    ; NOTE: do not shrink ARDUINO_LOOP_STACK_SIZE. setup() runs on that
    ; task, and TFT_eSPI's init plus NimBLE's overflow anything under the
    ; 8KB default - it double-faults before the first line of output.

    -O2

; If your exact board has 8MB or 16MB flash (check the silkscreen/datasheet -
; see README), you can raise this and switch to a bigger partition scheme.
board_upload.flash_size = 4MB

; ---------------------------------------------------------------------
[env:msx]
extends = cyd
build_src_filter = +<*.c> +<*.cpp> +<boards/cyd/> +<boards/common/> +<msx/>
build_flags =
    ${cyd.build_flags}
    -D HAVE_MACHINE_MSX
    -I src/msx
    ; fMSX's headers sit in subdirectories, so these have to be spelled out
    ; or #include "MSX.h" never resolves.
    -I lib/z80
    -I lib/fmsx_core/fMSX
    -I lib/fmsx_core/EMULib
    -I lib/fmsx_core/video
    ; --- fMSX core build flags ---
    -D BPS16
    -D LSB_FIRST
    -D ESP32
    ; Turns on Z80.c's own fast opcode fetch, which reads fMSX's RAM[]
    ; page table inline instead of calling RdZ80 for every instruction
    ; byte. RdZ80 must test for the slot register and the floppy
    ; controller on every read, and an opcode fetch can be neither.
    ; Measured on a fixed workload (MSX-BASIC sitting at its prompt, 1:1,
    ; which is the only way to compare - how long a frame takes depends on
    ; what the program is executing, not just on the T-states): 28.4 fps
    ; to 36.6, and the Z80's share of a frame from 15.2ms to 10.9ms.
    ;
    ; It also costs the Spectrum's copy of the core about 19%, which has
    ; nothing to do with the flag and everything to do with where the two
    ; copies then land in one 32kB instruction cache - measured by turning
    ; it off and on again. The Spectrum runs at 86fps and needs 50, so it
    ; is the one that can pay.
    -D FMSX
    ; Putting the interpreter's loop in IRAM instead of flash was tried
    ; next and does not fit: the linker comes out 5752 bytes over. That is
    ; the end of that road unless the loop itself shrinks.
; fmsx_core is the vendored emulator in lib/. It has to be named explicitly:
; its headers sit in subdirectories, so PlatformIO's dependency finder never
; matches #include "MSX.h" to it and would leave the whole core out of the
; build - which is exactly what happened, silently, for months.
lib_deps =
    ${cyd.lib_deps}
    z80
    fmsx_core

; ---------------------------------------------------------------------
[env:spectrum]
extends = cyd
build_src_filter = +<*.c> +<*.cpp> +<boards/cyd/> +<boards/common/> +<spectrum/> -<spectrum/spectrum_help_none.c>
build_flags =
    ${cyd.build_flags}
    -D HAVE_MACHINE_SPECTRUM
    -I src/spectrum
    -I lib/z80
    -D LSB_FIRST
; The Spectrum needs a Z80 and nothing else fMSX has, so it takes the CPU
; core on its own rather than the whole emulator.
lib_deps =
    ${cyd.lib_deps}
    z80
; PlatformIO will happily find and build anything under lib/ that looks
; referenced, and the MSX core is right there. Say no explicitly.
lib_ignore = fmsx_core

; ---------------------------------------------------------------------
; Both machines in one firmware, chosen at boot. This is the one to flash
; if you want the board to be either without reflashing it.
[env:cyd]
extends = cyd
build_src_filter = +<*.c> +<*.cpp> +<boards/cyd/> +<boards/common/> +<msx/> +<spectrum/> -<spectrum/spectrum_help_none.c>
build_flags =
    ${cyd.build_flags}
    -D HAVE_MACHINE_MSX
    -D HAVE_MACHINE_SPECTRUM
    -I src/msx
    -I src/spectrum
    -I lib/z80
    -I lib/fmsx_core/fMSX
    -I lib/fmsx_core/EMULib
    -I lib/fmsx_core/video
    -D BPS16
    -D LSB_FIRST
    -D ESP32
    ; Turns on Z80.c's own fast opcode fetch, which reads fMSX's RAM[]
    ; page table inline instead of calling RdZ80 for every instruction
    ; byte. RdZ80 must test for the slot register and the floppy
    ; controller on every read, and an opcode fetch can be neither.
    ; Measured on a fixed workload (MSX-BASIC sitting at its prompt, 1:1,
    ; which is the only way to compare - how long a frame takes depends on
    ; what the program is executing, not just on the T-states): 28.4 fps
    ; to 36.6, and the Z80's share of a frame from 15.2ms to 10.9ms.
    ;
    ; It also costs the Spectrum's copy of the core about 19%, which has
    ; nothing to do with the flag and everything to do with where the two
    ; copies then land in one 32kB instruction cache - measured by turning
    ; it off and on again. The Spectrum runs at 86fps and needs 50, so it
    ; is the one that can pay.
    -D FMSX
    ; Putting the interpreter's loop in IRAM instead of flash was tried
    ; next and does not fit: the linker comes out 5752 bytes over. That is
    ; the end of that road unless the loop itself shrinks.
lib_deps =
    ${cyd.lib_deps}
    z80
    fmsx_core

; =====================================================================
; The e-ink boards: M5Stack's Paper Mono and PaperS3, both ESP32-S3 with
; 8MB of octal PSRAM and 16MB of flash, both driven through freeink-sdk (a
; git submodule, pinned to the commit CrossPlay runs on the Paper Mono,
; which also carries the PaperS3's panel-power fix). One board layer for
; both, src/boards/eink/; what differs is src/boards/eink/eink_board.h,
; picked by EINK_BOARD_PAPERMONO or EINK_BOARD_PAPERS3 below.
;
; Each carries all three computers, chosen at boot by touch:
;
;   the MSX1 (Hotbit HB-8000) and the ZX Spectrum 48K, the same machines as
;   the CYD's, at exactly 2x with colour to 1 bit by contrast with the
;   border (src/boards/eink/display8.c), played from the BLE keyboard; a
;   tap opens their list of cartridges and snapshots.
;
;   the Macintosh: umac (lib/umac), a Mac Plus at its own 512x342 with 4MB
;   of RAM in PSRAM, scaled to the panel's height, touch as a trackpad.
;   Boots System 6 and 7. tools/machost and tools/eink_test build the same
;   Mac on the development machine and must be given the same numbers.
;
; ROMs, the Mac's disc and the snapshots come from the local, gitignored
; files the CYD uses (tools/local_bios.py) and roms/mac/ (tools/local_mac.py).
[eink]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/local_bios.py, pre:tools/local_mac.py
build_unflags = -std=gnu++11
build_src_filter =
    +<*.c> +<boards/eink/> +<boards/common/>
    +<msx/> +<spectrum/> -<spectrum/spectrum_help.cpp> +<mac/>
build_flags =
    -std=gnu++2a
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -D BOARD_HAS_PSRAM
    -I src
    -I src/boards/eink
    -D HAVE_MACHINE_MSX
    -D HAVE_MACHINE_SPECTRUM
    -D HAVE_MACHINE_MAC
    -I src/boards/common
    -I src/msx
    -I src/spectrum
    -I src/mac
    -I lib/z80
    -I lib/fmsx_core/fMSX
    -I lib/fmsx_core/EMULib
    -I lib/fmsx_core/video
    -I lib/umac/include
    -I lib/umac/musashi
    ; the CYD's fMSX and Z80 flags, for the same reasons (see [env:cyd])
    -D BPS16
    -D LSB_FIRST
    -D ESP32
    -D FMSX
    -D UMAC_MEMSIZE=4096
    -D DISP_WIDTH=512
    -D DISP_HEIGHT=342
    ; the menus' font: freeink-sdk's FreeInkUI, header only
    -I freeink-sdk/libs/ui/FreeInkUI/include
    ; the BLE keyboard pairs as the PaperS3 MicroBASIC does, showing a code
    ; for keyboards that want one, and with its NimBLE settings
    -D BLE_KEYBOARD_PASSKEY
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=4
lib_deps =
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    ; the card, for the Mac's disc images (src/boards/eink/media_sd.cpp)
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    h2zero/NimBLE-Arduino @ ^2.3.8
    z80
    fmsx_core
    umac

; ---------------------------------------------------------------------
; M5Stack Paper Mono: 800x480 1-bit SSD1677, FT6336 touch, two buttons.
; Platform and memory settings exactly as CrossPlay builds for it; its
; partition table too, so the two share the device (the Mac went to app1,
; CrossPlay stays in app0).
[env:papermono]
extends = eink
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions-papermono.csv
build_flags =
    ${eink.build_flags}
    -D EINK_BOARD_PAPERMONO=1
    -D FREEINK_DEVICE_PAPERMONO=1
    ; The SD card is native 1-bit SDMMC, mounted through SdFat's
    ; block-device interface; freeink-sdk will not build without this even
    ; before anything mounts it.
    -D USE_BLOCK_DEVICE_INTERFACE=1
    -D BLE_KEYBOARD_NAME=\"PaperMono-Retro\"

; ---------------------------------------------------------------------
; M5Stack PaperS3: 4.7" ED047TC1, 960x540, driven over the S3's parallel
; bus by LovyanGFX (M5GFX), GT911 touch, no button the firmware can read.
; freeink-sdk's BoardPaperS3 carries the panel's pins. Memory settings and
; the M5GFX version are the PaperS3 MicroBASIC's, which run on this device;
; so is the partition table, shared with CrossPoint and MicroBASIC
; (partitions-papers3.csv): this firmware is app2, at 0x8A0000.
[env:papers3]
extends = eink
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitm-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 7667712
board_upload.offset_address = 0x8A0000
board_build.partitions = partitions-papers3.csv
build_flags =
    ${eink.build_flags}
    -D EINK_BOARD_PAPERS3=1
    -D FREEINK_DEVICE_PAPERS3=1
    -D BLE_KEYBOARD_NAME=\"PaperS3-Retro\"
lib_deps =
    ${eink.lib_deps}
    BoardPaperS3=symlink://freeink-sdk/libs/hardware/BoardPaperS3
    https://github.com/m5stack/M5GFX.git#0.2.26

; The PaperS3 with its panel driven directly (src/boards/eink/fastepd.c,
; after PaperBoy's Modos Smooth Graphics): no waveform, a changed picture on
; the glass in tens of milliseconds. Same slot and table as papers3.
[env:papers3-fast]
extends = env:papers3
build_flags =
    ${env:papers3.build_flags}
    -D EINK_FAST_PANEL=1
